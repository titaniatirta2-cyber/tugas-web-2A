<!DOCTYPE html>
<html lang="en">
<head>
    <title>Penggunaan Object</title>
</head>
<body>
    
    <script type="text/javascript">
        //membuat object 

        var obj = {
            penulis : "Titania Tirta Cahya Putri",
            buku : [
                "Modul Pemrograman Web",
                "Modul Pemrograman Mobile", 
            ],
            hal : 109,
            isTerbit : true
        }
       
        console.log(obj);

        //membuat object dengan constructor

        function orang(nama,gender,umur,alamat) {
            this.nama =nama;
            this.gender = gender;
            this.umur = umur;
            this.alamat = alamat;
        }

        //membuat instance object
        var Dewasa = new orang ('titania', 'P', 19, 'Jl. Raya Kediri - Nganjuk');
        console.log(Dewasa);
        
    </script>


</body>
</html>
